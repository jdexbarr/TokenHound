[project]
name = "tokenhound"
version = "0.0.1"
description = "Secret scanner for AI-era codebases, with a machine-learning false-positive classifier."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Barrera" }]
requires-python = ">=3.11"
keywords = ["security", "secrets", "secret-scanning", "devsecops", "machine-learning", "sarif"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/jdexbarr/tokenhound"
Issues = "https://github.com/jdexbarr/tokenhound/issues"

[project.scripts]
tokenhound = "tokenhound.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenhound"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of a test
    "S105", "S106",  # synthetic secrets and secret-like names are the point of these tests
    "S311",  # seeded pseudo-random data generates synthetic secrets
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["tokenhound"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
